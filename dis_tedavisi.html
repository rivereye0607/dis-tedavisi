<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diş Takip">
<title>Deniz - Ortodonti Takibi</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card-bg: #FFFFFF;
    --text-main: #1C1C1E;
    --text-muted: #8E8E93;
    --border: #E5E5EA;
    --pastel-green: #E8F5E9;
    --pastel-green-text: #2E7D32;
    --pastel-accent: #34C759;
    --danger: #FF3B30;
    --radius-lg: 20px;
    --radius-md: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .header {
    padding: 12px 4px 4px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 20px;
    font-weight: 700;
    color: var(--pastel-green-text);
    margin-top: 4px;
    letter-spacing: -0.3px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    border: 1px solid var(--border);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .stat-box {
    padding: 14px;
    border-radius: var(--radius-md);
    background: var(--bg);
  }
  .stat-box.highlight {
    background: var(--pastel-green);
  }
  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 22px;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: -0.5px;
  }
  .stat-box.highlight .stat-value {
    color: var(--pastel-green-text);
  }

  .progress-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .progress-bar {
    height: 10px;
    background: var(--bg);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--pastel-accent);
    border-radius: 100px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .progress-text {
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
    font-weight: 500;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .form-row {
    display: flex;
    gap: 10px;
  }
  .input-field {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
  }
  .currency-selector {
    display: flex;
    background: var(--bg);
    padding: 3px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
  }
  .currency-btn {
    border: none;
    background: transparent;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 9px;
    color: var(--text-muted);
    cursor: pointer;
  }
  .currency-btn.active {
    background: var(--card-bg);
    color: var(--text-main);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .btn-primary {
    background: var(--text-main);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius-md);
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  .btn-primary:active { opacity: 0.8; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
  }
  .item-date { font-size: 12px; color: var(--text-muted); }
  .item-orig { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .item-usd { font-size: 15px; font-weight: 700; color: var(--pastel-green-text); text-align: right; }
  .item-rate { font-size: 11px; color: var(--text-muted); text-align: right; }
  .delete-btn { background: none; border: none; color: var(--danger); font-size: 18px; margin-left: 12px; cursor: pointer; padding: 0 4px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Deniz Ortodonti Takibi</h1>
    <p>Hedef: 2.000 USD</p>
  </div>

  <div class="card">
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Ödenen</div>
        <div class="stat-value" id="totalPaid">$0.00</div>
      </div>
      <div class="stat-box highlight">
        <div class="stat-label">Kalan Borç</div>
        <div class="stat-value" id="totalRemaining">$2,000.00</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progressBar" style="width: 0%;"></div>
      </div>
      <div class="progress-text" id="progressPct">%0 tamamlandı</div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <div class="form-row">
        <input type="number" id="amountInput" class="input-field" placeholder="Miktar" inputmode="decimal">
        <div class="currency-selector">
          <button class="currency-btn active" id="btnUSD" onclick="setCurrency('USD')">USD</button>
          <button class="currency-btn" id="btnEUR" onclick="setCurrency('EUR')">EUR</button>
        </div>
      </div>
      <input type="date" id="dateInput" class="input-field">
      <button class="btn-primary" onclick="addPayment()">Yeni Ödeme Ekle</button>
    </div>
  </div>

  <div class="history-list" id="historyList"></div>
</div>

<script>
const GOAL = 2000;
const EUR_RATE = 1.1735;
let currency = 'USD';

const initialPayments = [
  { id: 13, date: 'Tarihsiz', original: 100, currency: 'USD', usd: 100.00, rate: null },
  { id: 12, date: '18.04.2026', original: 150, currency: 'USD', usd: 150.00, rate: null },
  { id: 11, date: '03.03.2026', original: 100, currency: 'USD', usd: 100.00, rate: null },
  { id: 10, date: '03.02.2026', original: 100, currency: 'EUR', usd: 117.35, rate: EUR_RATE },
  { id: 9,  date: '06.01.2026', original: 100, currency: 'USD', usd: 100.00, rate: null },
  { id: 8,  date: '13.12.2025', original: 120, currency: 'EUR', usd: 140.82, rate: EUR_RATE },
  { id: 7,  date: '15.11.2025', original: 100, currency: 'EUR', usd: 117.35, rate: EUR_RATE },
  { id: 6,  date: '11.10.2025', original: 100, currency: 'USD', usd: 100.00, rate: null },
  { id: 5,  date: '12.09.2025', original: 120, currency: 'EUR', usd: 140.82, rate: EUR_RATE },
  { id: 4,  date: '22.07.2025', original: 130, currency: 'EUR', usd: 152.56, rate: EUR_RATE },
  { id: 3,  date: '08.07.2025', original: 130, currency: 'USD', usd: 130.00, rate: null },
  { id: 2,  date: '31.05.2025', original: 120, currency: 'USD', usd: 120.00, rate: null },
  { id: 1,  date: '19.04.2025', original: 500, currency: 'USD', usd: 500.00, rate: null }
];

let payments = [];

function loadData() {
  const saved = localStorage.getItem('dis_takip_gh');
  if (saved) {
    payments = JSON.parse(saved);
  } else {
    payments = initialPayments;
    saveData();
  }
}

function saveData() {
  localStorage.setItem('dis_takip_gh', JSON.stringify(payments));
}

function setCurrency(c) {
  currency = c;
  document.getElementById('btnUSD').classList.toggle('active', c === 'USD');
  document.getElementById('btnEUR').classList.toggle('active', c === 'EUR');
}

function addPayment() {
  const amt = parseFloat(document.getElementById('amountInput').value);
  if (!amt || amt <= 0) return;

  const dateVal = document.getElementById('dateInput').value;
  let usdAmt = amt;
  let rateUsed = null;

  if (currency === 'EUR') {
    rateUsed = EUR_RATE;
    usdAmt = amt * rateUsed;
  }

  let displayDate = dateVal ? dateVal.split('-').reverse().join('.') : new Date().toLocaleDateString('tr-TR');

  payments.unshift({
    id: Date.now(),
    date: displayDate,
    original: amt,
    currency: currency,
    usd: usdAmt,
    rate: rateUsed
  });

  saveData();
  document.getElementById('amountInput').value = '';
  render();
}

function deletePayment(id) {
  payments = payments.filter(p => p.id !== id);
  saveData();
  render();
}

function render() {
  const total = payments.reduce((s, p) => s + p.usd, 0);
  const remaining = Math.max(0, GOAL - total);
  const pct = Math.min(100, (total / GOAL) * 100);

  document.getElementById('totalPaid').textContent = '$' + total.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('totalRemaining').textContent = '$' + remaining.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressPct').textContent = '%' + pct.toFixed(1) + ' tamamlandı';

  const list = document.getElementById('historyList');
  list.innerHTML = payments.map(p => `
    <div class="history-item">
      <div>
        <div class="item-date">${p.date}</div>
        <div class="item-orig">${p.original} ${p.currency}</div>
      </div>
      <div style="display:flex; align-items:center;">
        <div>
          <div class="item-usd">$${p.usd.toFixed(2)}</div>
          ${p.rate ? `<div class="item-rate">kur: ${p.rate}</div>` : ''}
        </div>
        <button class="delete-btn" onclick="deletePayment(${p.id})">×</button>
      </div>
    </div>
  `).join('');
}

document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

loadData();
render();
</script>
</body>
</html>
